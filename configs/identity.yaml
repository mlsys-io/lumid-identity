app:
  port: 9900
  mode: debug
  issuer: https://lum.id

mysql:
  # Inside Docker, override MYSQL_HOST=host.docker.internal so we hit
  # the trading_mysql container via the host gateway.
  host: "${MYSQL_HOST}"
  port: 3306
  user: root
  password: "${MYSQL_ROOT_PASSWORD}"
  database: lumid_identity

redis:
  addr: "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 3   # db 0 is LQA, 1-2 reserved, 3 for identity

signing:
  # Each .pem here = one RS256 keypair. Filename (sans ext) = kid.
  # Losing this dir invalidates every issued JWT — the Docker compose
  # persists it at /var/lib/lumid-identity/signing-keys on the host.
  key_dir: "${SIGNING_KEY_DIR}"

jwt:
  access_ttl_sec: 86400      # 24h — OAuth access/ID tokens handed to other clients
  # Browser login (lm_session cookie + its JWT): 30 days, so lum.id stays signed
  # in for a month (2026-11-15; was the 24h above, users found re-login daily too
  # often). Still revocable: logout / password change / suspension denylist the
  # jti, and a role change revokes the user's sessions (admin_users.go).
  session_ttl_sec: 2592000   # 30 days
  refresh_ttl_sec: 2592000   # 30 days

oauth:
  google:
    client_id: "${GOOGLE_CLIENT_ID}"
    client_secret: "${GOOGLE_CLIENT_SECRET}"
    redirect_uri: https://lum.id/auth/callback
  github:
    client_id: "${GITHUB_CLIENT_ID}"
    client_secret: "${GITHUB_CLIENT_SECRET}"
    redirect_uri: https://lum.id/auth/callback

legacy:
  # Shadow mode: read from QuantArena MySQL so we can mirror its
  # introspect responses without migrating data. Set false after Phase 3.
  enabled: true
  dsn: "root:${MYSQL_ROOT_PASSWORD}@tcp(${MYSQL_HOST}:3306)/trading_community?parseTime=true&charset=utf8mb4"

email:
  # Gmail app password — same account already used for LQA verification
  # emails, ported into this service so lum.id owns the sender identity.
  # Empty SMTP_HOST falls back to stdout logging (dev mode).
  smtp_host: "${EMAIL_SMTP_HOST}"
  smtp_port: 465
  smtp_user: "${EMAIL_SMTP_USER}"
  smtp_password: "${EMAIL_SMTP_PASSWORD}"
  from_address: "${EMAIL_FROM_ADDRESS}"
  from_name: "${EMAIL_FROM_NAME}"
  reset_base_url: "https://lum.id/auth/reset-password"
